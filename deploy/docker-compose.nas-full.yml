services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args:
        BASE_IMAGE_PREFIX: ${BASE_IMAGE_PREFIX:-}
    container_name: market-backend-nas
    volumes:
      - ${MARKET_DATA_HOST_DIR:-/volume1/docker/market-live-terminal/data}:/runtime-data
    environment:
      - FORMAL_MARKET_DATA_ROOT=/runtime-data
      - LIVE_DATA_ROOT=/runtime-data/live
      - RESEARCH_CURRENT_ROOT=/runtime-data/research/current
      - DATA_DIR=/runtime-data/research/current
      - DB_PATH=/runtime-data/live/market_data.db
      - USER_DB_PATH=/runtime-data/live/user_data.db
      - SELECTION_DATA_DIR=/runtime-data/research/current/selection
      - SELECTION_DB_PATH=/runtime-data/research/current/selection/selection_research.db
      - MODEL_FEATURE_DB_PATH=/runtime-data/research/current/selection/model_feature_store.db
      - MODEL_INDEX_DB=/runtime-data/research/current/selection/model_market_index_daily.db
      - ATOMIC_FACTS_DIR=/runtime-data/research/current/atomic_facts
      - ATOMIC_MAINBOARD_DB_PATH=/runtime-data/research/current/atomic_facts/market_atomic_mainboard_compact_current.db
      - ATOMIC_DB_PATH=/runtime-data/research/current/atomic_facts/market_atomic_mainboard_compact_current.db
      - ATOMIC_COMPACT_DB_PATH=/runtime-data/research/current/atomic_facts/market_atomic_mainboard_compact_current.db
      - ENABLE_ATOMIC_COMPACT_READ=true
      - MARKET_HEAT_DIR=/runtime-data/research/current/market_heat
      - MARKET_HEAT_ATOMIC_DB=/runtime-data/research/current/atomic_facts/market_atomic_mainboard_compact_current.db
      - TRADABLE_THEME_MAP_DB=/runtime-data/research/current/market_heat/tradable_theme_map.db
      - FINE_THEME_HEAT_DB=/runtime-data/research/current/market_heat/fine_theme_heat_daily.db
      - FINE_THEME_HEAT_V2_DB=/runtime-data/research/current/market_heat/fine_theme_heat_daily_v2.db
      - FINE_THEME_HEAT_FORECAST_DB=/runtime-data/research/current/market_heat/fine_theme_heat_forecast.db
      - HOT_THEME_LOW_POSITION_L2_SAMPLES_DB=/runtime-data/research/current/market_heat/hot_theme_low_position_l2_samples.db
      - SPARK_OPPORTUNITY_SELECTION_DB=/runtime-data/research/current/selection/selection_research.db
      - SPARK_OPPORTUNITY_HEAT_DB=/runtime-data/research/current/market_heat/fine_theme_heat_daily_v2.db
      - AGGRESSIVE_10CM_SELECTION_DB=/runtime-data/research/current/selection/selection_research.db
      - AGGRESSIVE_10CM_FINE_HEAT_DB=/runtime-data/research/current/market_heat/fine_theme_heat_daily_v2.db
      - TZ=Asia/Shanghai
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-3.5-turbo}
      - LLM_PROXY=${LLM_PROXY:-}
      - INGEST_TOKEN=${INGEST_TOKEN}
      - WRITE_API_TOKEN=${WRITE_API_TOKEN}
      - ENABLE_BACKGROUND_RUNTIME=${ENABLE_BACKGROUND_RUNTIME:-false}
      - ENABLE_CLOUD_COLLECTOR=${ENABLE_CLOUD_COLLECTOR:-false}
      - ENABLE_RESEARCH_API_ROUTES=${ENABLE_RESEARCH_API_ROUTES:-true}
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        BASE_IMAGE_PREFIX: ${BASE_IMAGE_PREFIX:-}
        VITE_CLOUD_LITE_MODE: ${VITE_CLOUD_LITE_MODE:-false}
    container_name: market-frontend-nas
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    environment:
      - WRITE_API_TOKEN=${WRITE_API_TOKEN}
    depends_on:
      - backend
    restart: unless-stopped

  crawler:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args:
        BASE_IMAGE_PREFIX: ${BASE_IMAGE_PREFIX:-}
    container_name: market-crawler-nas
    command: ["python", "-u", "backend/scripts/live_crawler_win.py"]
    profiles: ["crawler"]
    volumes:
      - ${MARKET_DATA_HOST_DIR:-/volume1/docker/market-live-terminal/data}:/runtime-data
    environment:
      - FORMAL_MARKET_DATA_ROOT=/runtime-data
      - LIVE_DATA_ROOT=/runtime-data/live
      - RESEARCH_CURRENT_ROOT=/runtime-data/research/current
      - DB_PATH=/runtime-data/live/market_data.db
      - USER_DB_PATH=/runtime-data/live/user_data.db
      - DATA_DIR=/runtime-data/live
      - TZ=Asia/Shanghai
      - CLOUD_API_URL=http://backend:8000
      - INGEST_TOKEN=${INGEST_TOKEN}
      - FOCUS_TICK_INTERVAL_SECONDS=${FOCUS_TICK_INTERVAL_SECONDS:-5}
      - WARM_TICK_INTERVAL_SECONDS=${WARM_TICK_INTERVAL_SECONDS:-30}
      - FULL_SWEEP_INTERVAL_SECONDS=${FULL_SWEEP_INTERVAL_SECONDS:-900}
      - FINAL_SWEEP_RETRY_INTERVAL_SECONDS=${FINAL_SWEEP_RETRY_INTERVAL_SECONDS:-90}
      - FOCUS_SNAPSHOT_INTERVAL_SECONDS=${FOCUS_SNAPSHOT_INTERVAL_SECONDS:-3}
      - WARM_SNAPSHOT_INTERVAL_SECONDS=${WARM_SNAPSHOT_INTERVAL_SECONDS:-10}
      - AKSHARE_TICK_TIMEOUT_SECONDS=${AKSHARE_TICK_TIMEOUT_SECONDS:-15}
    depends_on:
      - backend
    restart: unless-stopped
